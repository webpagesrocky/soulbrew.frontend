# Configuración de despliegue en Netlify.

[build]
  command = "npm run build"
  publish = "dist"

# Mismo propósito que public/_redirects, declarado también aquí para que la
# regla exista aunque el sitio se despliegue subiendo la carpeta dist a mano.
# Sin esto, recargar en /interna devuelve el 404 de Netlify en vez de la app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El bundle lleva hash en el nombre, así que puede cachearse indefinidamente.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html no debe cachearse: es quien apunta al bundle nuevo tras cada
# despliegue.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
